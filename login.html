<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Digital Gram Panchayat</title>
  <meta name="description" content="Login to your Digital Gram Panchayat citizen account." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="site-header"></div>

  <main id="main-content" class="flex-1 flex items-center justify-center py-14 px-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-6">
        <span class="gp-seal mx-auto mb-3" style="display:flex;">GP</span>
        <h1 class="font-display font-semibold text-2xl text-[var(--color-text)]">Citizen Login</h1>
        <p class="mt-1.5 text-sm text-[var(--color-text-muted)]">Log in to apply for certificates and track applications.</p>
      </div>

      <form id="login-form" class="bg-white rounded-xl border border-[var(--color-border)] p-6 sm:p-8 space-y-5" novalidate>
        <div>
          <label for="login-email" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Email <span class="text-[var(--color-accent)]">*</span></label>
          <input type="email" id="login-email" autocomplete="username" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
          <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="login-email"></p>
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="block text-sm font-medium text-[var(--color-text)]">Password <span class="text-[var(--color-accent)]">*</span></label>
            <button type="button" id="forgot-password-btn" class="text-xs font-medium text-[var(--color-primary)] hover:underline">Forgot password?</button>
          </div>
          <div class="relative">
            <input type="password" id="login-password" autocomplete="current-password" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 pr-11 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
            <button type="button" data-toggle-password="login-password" class="absolute inset-y-0 right-0 px-3 text-[var(--color-text-muted)]" aria-label="Show password">
              <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
            </button>
          </div>
          <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="login-password"></p>
        </div>
        <button type="submit" class="w-full px-6 py-3 rounded-md bg-[var(--color-primary)] text-white text-sm font-medium hover:bg-[var(--color-primary-dark)]">Login</button>
        <p class="text-center text-sm text-[var(--color-text-muted)]">Don't have an account? <a href="register.html" class="font-medium text-[var(--color-primary)] hover:underline">Create Account</a></p>
      </form>

      <p class="mt-6 text-center text-xs text-[var(--color-text-muted)]">Panchayat staff should use the <a href="staff/login.html" class="underline hover:text-[var(--color-primary)]">staff login</a> instead.</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/utils.js"></script>
  <script src="js/validation.js"></script>
  <script>window.SITE_BASE = '';</script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script>
    initPublicLayout('');

    document.querySelectorAll('[data-toggle-password]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.getAttribute('data-toggle-password'));
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    document.getElementById('forgot-password-btn').addEventListener('click', () => {
      showToast('Password reset will be available once Firebase Authentication is connected.', 'info');
    });

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const isValid = validateFields({
        'login-email': [Validators.required, Validators.email],
        'login-password': [Validators.required],
      });
      if (!isValid) return;
      showToast('Sign-in will be connected to Firebase Authentication in a later phase.', 'info');
    });
  </script>
</body>
</html>
