<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — Digital Gram Panchayat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="min-h-screen flex flex-col bg-[var(--color-bg)]">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="auth-checking-overlay" class="fixed inset-0 z-[100] bg-[var(--color-bg)] flex items-center justify-center">
    <div class="text-center">
      <div class="mx-auto h-8 w-8 border-2 border-[var(--color-border)] border-t-[var(--color-primary)] rounded-full animate-spin"></div>
      <p class="mt-3 text-sm text-[var(--color-text-muted)]">Checking your session…</p>
    </div>
  </div>
  <div id="site-header"></div>

  <div class="flex flex-1 min-h-0">
    <div id="dashboard-sidebar" class="fixed inset-y-0 left-0 z-50 w-64 -translate-x-full transition-transform duration-200 lg:static lg:translate-x-0 lg:z-auto lg:shrink-0"></div>

    <main id="main-content" class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8">
      <div class="max-w-2xl mx-auto">
        <h1 class="font-display font-semibold text-2xl text-[var(--color-text)] mb-1">My Profile</h1>
        <p class="text-sm text-[var(--color-text-muted)] mb-6">Keep your contact details up to date for application communication.</p>

        <form id="profile-form" class="bg-white rounded-xl border border-[var(--color-border)] p-6 sm:p-8 space-y-5" novalidate>
          <div>
            <label for="profile-name" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Full name <span class="text-[var(--color-accent)]">*</span></label>
            <input type="text" id="profile-name" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
            <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="profile-name"></p>
          </div>
          <div>
            <label for="profile-mobile" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Mobile number <span class="text-[var(--color-accent)]">*</span></label>
            <input type="tel" id="profile-mobile" maxlength="10" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
            <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="profile-mobile"></p>
          </div>
          <div>
            <label for="profile-email" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Email</label>
            <input type="email" id="profile-email" disabled class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm bg-[var(--color-bg)] text-[var(--color-text-muted)] cursor-not-allowed" />
            <p class="mt-1.5 text-xs text-[var(--color-text-muted)]">Your login email cannot be changed here.</p>
          </div>
          <div class="pt-2 flex gap-3">
            <button type="submit" class="px-6 py-2.5 rounded-md bg-[var(--color-primary)] text-white text-sm font-medium hover:bg-[var(--color-primary-dark)]">Save changes</button>
          </div>
        </form>

      </div>
    </main>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/validation.js"></script>
  <script>window.SITE_BASE = '../';</script>
  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script>
    whenAuthReady(() => {
      GPAuth.protectPage('citizen', {
        loginUrl: '../login.html',
        otherRoleUrl: '../staff/dashboard.html',
      }).then(({ user, profile }) => {
        hideAuthCheckingOverlay();
        initDashboardShell({ role: 'citizen', activeKey: 'profile', pageTitle: 'My Profile' });

        // Prefill with the signed-in citizen's real Firestore profile.
        document.getElementById('profile-name').value = profile.name || '';
        document.getElementById('profile-mobile').value = profile.mobile || '';
        document.getElementById('profile-email').value = user.email || '';

        document.getElementById('profile-form').addEventListener('submit', function (e) {
          e.preventDefault();
          const isValid = validateFields({
            'profile-name': [Validators.required],
            'profile-mobile': [Validators.required, Validators.mobile],
          });
          if (!isValid) return;
          const button = document.querySelector('#profile-form button[type="submit"]');
          setButtonLoading(button, true, 'Saving…');
          GPAuth.updateOwnProfile({ name: document.getElementById('profile-name').value, mobile: document.getElementById('profile-mobile').value })
            .then(() => showToast('Your profile was saved.', 'success'))
            .catch((error) => showToast(error.message, 'error'))
            .finally(() => setButtonLoading(button, false));
        });
      });
    });
  </script>
</body>
</html>
