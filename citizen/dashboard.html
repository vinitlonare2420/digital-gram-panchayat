<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Digital Gram Panchayat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="min-h-screen flex flex-col bg-[var(--color-bg)]">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="auth-checking-overlay" class="fixed inset-0 z-[100] bg-[var(--color-bg)] flex items-center justify-center">
    <div class="text-center">
      <div class="mx-auto h-8 w-8 border-2 border-[var(--color-border)] border-t-[var(--color-primary)] rounded-full animate-spin"></div>
      <p class="mt-3 text-sm text-[var(--color-text-muted)]">Checking your session…</p>
    </div>
  </div>
  <div id="site-header"></div>

  <div class="flex flex-1 min-h-0">
    <div id="dashboard-sidebar" class="fixed inset-y-0 left-0 z-50 w-64 -translate-x-full transition-transform duration-200 lg:static lg:translate-x-0 lg:z-auto lg:shrink-0"></div>

    <main id="main-content" class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8">
      <div class="max-w-6xl mx-auto">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
          <div>
            <h1 class="font-display font-semibold text-2xl text-[var(--color-text)]">Your Dashboard</h1>
            <p class="mt-1 text-sm text-[var(--color-text-muted)]">An overview of your certificate applications.</p>
          </div>
          <a href="../services.html" class="px-4 py-2.5 rounded-md bg-[var(--color-primary)] text-white text-sm font-medium hover:bg-[var(--color-primary-dark)]">Apply for a certificate</a>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
          <div class="bg-white rounded-xl border border-[var(--color-border)] p-4">
            <p class="text-xs text-[var(--color-text-muted)]">Total Applications</p>
            <p id="stat-total" class="mt-1.5 font-display font-semibold text-2xl text-[var(--color-text)]">…</p>
          </div>
          <div class="bg-white rounded-xl border border-[var(--color-border)] p-4">
            <p class="text-xs text-[var(--color-text-muted)]">Submitted</p>
            <p id="stat-submitted" class="mt-1.5 font-display font-semibold text-2xl" style="color:var(--status-submitted-fg);">…</p>
          </div>
          <div class="bg-white rounded-xl border border-[var(--color-border)] p-4">
            <p class="text-xs text-[var(--color-text-muted)]">Under Review</p>
            <p id="stat-under-review" class="mt-1.5 font-display font-semibold text-2xl" style="color:var(--status-review-fg);">…</p>
          </div>
          <div class="bg-white rounded-xl border border-[var(--color-border)] p-4">
            <p class="text-xs text-[var(--color-text-muted)]">Approved</p>
            <p id="stat-approved" class="mt-1.5 font-display font-semibold text-2xl" style="color:var(--status-approved-fg);">…</p>
          </div>
          <div class="bg-white rounded-xl border border-[var(--color-border)] p-4">
            <p class="text-xs text-[var(--color-text-muted)]">Rejected</p>
            <p id="stat-rejected" class="mt-1.5 font-display font-semibold text-2xl" style="color:var(--status-rejected-fg);">…</p>
          </div>
        </div>

        <section class="mt-8" aria-labelledby="availability-heading">
          <div class="flex items-center justify-between mb-3">
            <h2 id="availability-heading" class="font-display font-semibold text-lg text-[var(--color-text)]">Staff availability</h2>
            <a href="availability.html" class="text-sm font-medium text-[var(--color-primary)] hover:underline">Details</a>
          </div>
          <div class="bg-white rounded-xl border border-[var(--color-border)] p-5">
            <div id="availability-card" role="status" aria-live="polite"></div>
          </div>
        </section>

        <div class="mt-8">
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-display font-semibold text-lg text-[var(--color-text)]">Recent applications</h2>
            <a href="applications.html" class="text-sm font-medium text-[var(--color-primary)] hover:underline">View all</a>
          </div>
          <div id="recent-applications"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/validation.js"></script>
  <script>window.SITE_BASE = '../';</script>
  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/availability-ui.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/applications.js"></script>
  <script type="module" src="../js/availability.js"></script>
  <script>
    whenAuthReady(() => {
      GPAuth.protectPage('citizen', {
        loginUrl: '../login.html',
        otherRoleUrl: '../staff/dashboard.html',
      }).then(() => {
        hideAuthCheckingOverlay();
        initDashboardShell({ role: 'citizen', activeKey: 'dashboard', pageTitle: 'Dashboard' });
        initCitizenAvailability(document.getElementById('availability-card'), { compact: true });

        const recentEl = document.getElementById('recent-applications');
        recentEl.innerHTML = `
          <div class="bg-white rounded-xl border border-[var(--color-border)] p-10 text-center text-sm text-[var(--color-text-muted)]">
            Loading applications…
          </div>`;

        whenAppsReady(async () => {
          let applications;
          try {
            applications = await GPApplications.getMyApplications();
          } catch (error) {
            ['total', 'submitted', 'under-review', 'approved', 'rejected'].forEach((k) => { document.getElementById('stat-' + k).textContent = '—'; });   // never show a made-up 0 when loading failed
            recentEl.innerHTML = `
              <div class="bg-white rounded-xl border border-[var(--color-border)] p-10 text-center">
                <p class="text-sm text-red-600">${error.message}</p>
              </div>`;
            return;
          }

          const stats = GPApplications.getApplicationStats(applications);
          document.getElementById('stat-total').textContent = stats.total;
          document.getElementById('stat-submitted').textContent = stats.submitted;
          document.getElementById('stat-under-review').textContent = stats.under_review;
          document.getElementById('stat-approved').textContent = stats.approved;
          document.getElementById('stat-rejected').textContent = stats.rejected;

          if (applications.length === 0) {
            renderEmptyState(recentEl, {
              title: 'No applications found',
              message: 'Your submitted applications will appear here once you apply for a certificate.',
              actionLabel: 'Apply for a certificate',
              actionHref: '../services.html',
            });
            return;
          }

          const recent = applications.slice(0, 5);
          recentEl.innerHTML = `
            <div class="bg-white rounded-xl border border-[var(--color-border)] divide-y divide-[var(--color-border)]">
              ${recent.map((app) => `
                <a href="application-details.html?id=${app.docId}" class="flex items-center justify-between gap-4 px-4 sm:px-5 py-4 hover:bg-[var(--color-bg)] transition-colors">
                  <div class="min-w-0">
                    <p class="font-medium text-sm text-[var(--color-text)] truncate">${escapeHtml(serviceLabel(app))}</p>
                    <p class="text-xs text-[var(--color-text-muted)] mt-0.5">${escapeHtml(app.applicationId)} · ${formatDate(app.submittedAt?.toDate ? app.submittedAt.toDate() : null)}</p>
                  </div>
                  ${statusBadgeHTML(app.status)}
                </a>
              `).join('')}
            </div>`;
        });
      });
    });
  </script>
</body>
</html>
