# GitHub Pages — STATIC BACKUP of Digital Gram Panchayat.
#
# The real application runs on Vercel (static pages + the /api serverless functions). GitHub
# Pages can only serve files, so this workflow does NOT publish the repository. It runs
# scripts/build-static-backup.js, which assembles an information-only site in dist-static/
# (public pages with a "static backup" banner + a notice page at every other address) and
# FAILS if the result contains anything that must not be public. Only dist-static/ is uploaded.
#
# One-time setup (see README → "GitHub Pages static backup"):
#   1. Repository → Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Repository → Settings → Secrets and variables → Actions → Variables → New repository
#      variable  PRIMARY_APP_URL  =  https://<your-vercel-domain>   (a public address, NOT a secret).
#      Without it the backup still builds, but its notice pages cannot link to the main application.
#
# This workflow needs no secrets and never reads .env files or the api/ folder.
name: Static backup (GitHub Pages)

on:
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel a deployment that is already running.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the static backup (public pages only, verified)
        env:
          PRIMARY_APP_URL: ${{ vars.PRIMARY_APP_URL }}
        run: node scripts/build-static-backup.js --out dist-static

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (dist-static only — never the whole repository)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
