<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login — Digital Gram Panchayat</title>
  <meta name="description" content="Panchayat staff login for the Digital Gram Panchayat administration portal." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="min-h-screen flex flex-col bg-[var(--color-bg)]">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="gov-hairline"></div>
  <header class="bg-[var(--color-text)] py-4">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2.5">
        <span class="gp-seal" style="width:2.1rem;height:2.1rem;font-size:0.8rem;">GP</span>
        <span class="text-sm font-display font-semibold text-white">Digital Gram Panchayat</span>
      </a>
      <a href="../index.html" class="text-xs font-medium text-gray-300 hover:text-white">&larr; Back to citizen portal</a>
    </div>
  </header>

  <main id="main-content" class="flex-1 flex items-center justify-center py-14 px-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-6">
        <span class="inline-flex items-center justify-center h-12 w-12 rounded-full bg-[var(--color-accent-light)] text-[var(--color-accent)] mb-3">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" /></svg>
        </span>
        <h1 class="font-display font-semibold text-2xl text-[var(--color-text)]">Panchayat Staff Login</h1>
        <p class="mt-1.5 text-sm text-[var(--color-text-muted)]">Restricted access for authorised Panchayat staff only.</p>
      </div>

      <form id="staff-login-form" class="bg-white rounded-xl border border-[var(--color-border)] p-6 sm:p-8 space-y-5" novalidate>
        <div>
          <label for="staff-email" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Staff email <span class="text-[var(--color-accent)]">*</span></label>
          <input type="email" id="staff-email" autocomplete="username" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
          <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="staff-email"></p>
        </div>
        <div>
          <label for="staff-password" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Password <span class="text-[var(--color-accent)]">*</span></label>
          <input type="password" id="staff-password" autocomplete="current-password" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
          <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="staff-password"></p>
        </div>
        <button type="submit" class="w-full px-6 py-3 rounded-md bg-[var(--color-text)] text-white text-sm font-medium hover:bg-black">Login</button>
      </form>
      <p class="mt-4 text-center text-xs text-[var(--color-text-muted)]">Staff accounts are provisioned by the Panchayat administrator and are not self-registered.</p>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/validation.js"></script>
  <script>window.SITE_BASE = '../';</script>
  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script>
    ensureToastContainer();

    // Already-signed-in staff skip straight to their dashboard; an
    // already-signed-in citizen is sent back to the citizen dashboard
    // rather than shown a form meant for staff.
    whenAuthReady(() => {
      GPAuth.redirectIfAlreadyLoggedIn({
        citizenUrl: '../citizen/dashboard.html',
        staffUrl: 'dashboard.html',
      });
    });

    document.getElementById('staff-login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const isValid = validateFields({
        'staff-email': [Validators.required, Validators.email],
        'staff-password': [Validators.required],
      });
      if (!isValid) return;

      const email = document.getElementById('staff-email').value.trim();
      const password = document.getElementById('staff-password').value;
      const submitBtn = document.querySelector('#staff-login-form button[type="submit"]');

      whenAuthReady(async () => {
        setButtonLoading(submitBtn, true, 'Signing in…');
        try {
          const { profile } = await GPAuth.loginWithEmail(email, password);
          if (profile.role !== 'staff') {
            await GPAuth.signOutOnly();
            showToast('This login is for Panchayat staff only.', 'error');
            setButtonLoading(submitBtn, false);
            return;
          }
          showToast('Login successful.', 'success');
          window.location.href = 'dashboard.html';
        } catch (error) {
          showToast(error.message, 'error');
          setButtonLoading(submitBtn, false);
        }
      });
    });
  </script>
</body>
</html>
