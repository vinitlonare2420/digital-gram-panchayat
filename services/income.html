<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Income Certificate Application — Digital Gram Panchayat</title>
  <meta name="description" content="Apply online for an Income Certificate through the Digital Gram Panchayat portal." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="site-header"></div>

  <main id="main-content" class="flex-1">
    <section class="bg-[var(--color-primary-light)] border-b border-[var(--color-border)]">
      <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div id="breadcrumb" class="mb-4"></div>
        <h1 class="font-display font-semibold text-3xl text-[var(--color-text)]">Income Certificate Application</h1>
        <p class="mt-2 text-[var(--color-text-muted)]">Fill in accurate income details — this certificate is used for official verification.</p>
      </div>
    </section>

    <section id="requirements" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <div id="application-form-wrapper">
        <div class="bg-white rounded-xl border border-[var(--color-border)] p-5 mb-8">
          <h2 class="font-medium text-[var(--color-text)] text-sm">Documents required</h2>
          <ul class="mt-2 text-sm text-[var(--color-text-muted)] list-disc list-inside space-y-1">
            <li>Salary slips or other income proof</li>
            <li>Identity proof</li>
            <li>Address proof</li>
          </ul>
        </div>

        <form id="income-form" class="bg-white rounded-xl border border-[var(--color-border)] p-6 sm:p-8 space-y-8" novalidate>

        <fieldset>
          <legend class="font-display font-semibold text-[var(--color-text)] mb-4">Applicant details</legend>
          <div class="grid sm:grid-cols-2 gap-5">
            <div>
              <label for="applicant-name" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Applicant name <span class="text-[var(--color-accent)]">*</span></label>
              <input type="text" id="applicant-name" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="applicant-name"></p>
            </div>
            <div>
              <label for="guardian-name" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Father's / Guardian's name <span class="text-[var(--color-accent)]">*</span></label>
              <input type="text" id="guardian-name" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="guardian-name"></p>
            </div>
            <div class="sm:col-span-2">
              <label for="address" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Address <span class="text-[var(--color-accent)]">*</span></label>
              <textarea id="address" rows="3" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]"></textarea>
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="address"></p>
            </div>
            <div>
              <label for="mobile-number" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Mobile number <span class="text-[var(--color-accent)]">*</span></label>
              <input type="tel" id="mobile-number" maxlength="10" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="mobile-number"></p>
            </div>
            <div>
              <label for="occupation" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Occupation <span class="text-[var(--color-accent)]">*</span></label>
              <input type="text" id="occupation" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="occupation"></p>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend class="font-display font-semibold text-[var(--color-text)] mb-4">Income details</legend>
          <div class="grid sm:grid-cols-2 gap-5">
            <div>
              <label for="annual-income" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Annual income (₹) <span class="text-[var(--color-accent)]">*</span></label>
              <input type="number" min="0" id="annual-income" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="annual-income"></p>
            </div>
            <div>
              <label for="income-source" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Source of income <span class="text-[var(--color-accent)]">*</span></label>
              <select id="income-source" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] bg-white">
                <option value="">Select source</option>
                <option value="salary">Salary / Employment</option>
                <option value="agriculture">Agriculture</option>
                <option value="business">Business / Self-employed</option>
                <option value="other">Other</option>
              </select>
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="income-source"></p>
            </div>
            <div class="sm:col-span-2">
              <label for="family-details" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Family details <span class="text-[var(--color-accent)]">*</span></label>
              <textarea id="family-details" rows="3" placeholder="Number of family members and their occupations" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]"></textarea>
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="family-details"></p>
            </div>
            <div class="sm:col-span-2">
              <label for="purpose" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Purpose of certificate <span class="text-[var(--color-accent)]">*</span></label>
              <input type="text" id="purpose" placeholder="e.g. Scholarship application, subsidy" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="purpose"></p>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend class="font-display font-semibold text-[var(--color-text)] mb-4">Supporting documents</legend>
          <div id="upload-container"></div>
        </fieldset>

        <div class="pt-2 flex flex-col sm:flex-row gap-3">
          <button type="submit" class="px-6 py-3 rounded-md bg-[var(--color-primary)] text-white text-sm font-medium hover:bg-[var(--color-primary-dark)]">Submit Application</button>
          <a href="../services.html" class="px-6 py-3 rounded-md border border-[var(--color-border)] text-sm font-medium text-[var(--color-text)] text-center hover:border-[var(--color-primary)] hover:text-[var(--color-primary)]">Cancel</a>
        </div>
        </form>
      </div>

      <div id="success-screen" class="hidden bg-white rounded-xl border border-[var(--color-border)] p-8 sm:p-10 text-center"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/validation.js"></script>
  <script>window.SITE_BASE = '../';</script>
  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>
  <script type="module" src="../js/applications.js"></script>
  <script>
    initPublicLayout('services');
    renderBreadcrumb(document.getElementById('breadcrumb'), [
      { label: 'Home', href: '../index.html' },
      { label: 'Services', href: '../services.html' },
      { label: 'Income Certificate' },
    ]);
    const uploader = initFileUpload(document.getElementById('upload-container'), {
      label: 'Income proof / supporting document',
      fieldId: 'income-document',
    });

    let isSubmitting = false;

    document.getElementById('income-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (isSubmitting) return;

      const isValid = validateFields({
        'applicant-name': [Validators.required],
        'guardian-name': [Validators.required],
        'address': [Validators.required],
        'mobile-number': [Validators.required, Validators.mobile],
        'occupation': [Validators.required],
        'annual-income': [Validators.required, Validators.numeric],
        'income-source': [Validators.required],
        'family-details': [Validators.required],
        'purpose': [Validators.required],
      });
      const file = uploader.getFile();
      const fileError = validateFile(file);
      if (fileError) showFieldError(uploader.fieldId, fileError); else clearFieldError(uploader.fieldId);
      if (!isValid || fileError) return;

      const formData = {
        // "applicantName" here matches the Phase 3 brief's Income
        // Certificate schema — it's the name to print on the certificate,
        // entered fresh on the form. It's distinct from the trusted
        // top-level applicantName, which always comes from the signed-in
        // account's own Firestore profile.
        applicantName: document.getElementById('applicant-name').value.trim(),
        fatherName: document.getElementById('guardian-name').value.trim(),
        address: document.getElementById('address').value.trim(),
        occupation: document.getElementById('occupation').value.trim(),
        annualIncome: document.getElementById('annual-income').value.trim(),
        incomeSource: document.getElementById('income-source').value,
        purpose: document.getElementById('purpose').value.trim(),
        familyDetails: document.getElementById('family-details').value.trim(),
        applicantContactMobile: document.getElementById('mobile-number').value.trim(),
      };
      const documents = file ? [{ name: file.name, type: file.type, size: file.size }] : [];

      const submitBtn = document.querySelector('#income-form button[type="submit"]');
      isSubmitting = true;

      whenAppsReady(async () => {
        setButtonLoading(submitBtn, true, 'Submitting application…');
        try {
          const { docId, applicationId } = await GPApplications.createApplication({
            serviceType: 'income',
            serviceName: 'Income Certificate',
            formData,
            documents,
          });

          document.getElementById('application-form-wrapper').classList.add('hidden');
          const successEl = document.getElementById('success-screen');
          successEl.classList.remove('hidden');
          renderApplicationSuccess(successEl, {
            applicationId,
            viewHref: `../citizen/application-details.html?id=${docId}`,
            dashboardHref: '../citizen/dashboard.html',
          });
          successEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (error) {
          if (error.message === 'Please log in to submit your application.') {
            showToast(error.message, 'error');
            window.location.href = `../login.html?redirect=${encodeURIComponent('services/income.html')}`;
            return;
          }
          showToast(error.message, 'error');
        } finally {
          isSubmitting = false;
          setButtonLoading(submitBtn, false);
        }
      });
    });
  </script>
</body>
</html>
