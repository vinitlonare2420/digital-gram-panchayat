<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birth Certificate Application — Digital Gram Panchayat</title>
  <meta name="description" content="Apply online for a Birth Certificate through the Digital Gram Panchayat portal." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="site-header"></div>

  <main id="main-content" class="flex-1">
    <section class="bg-[var(--color-primary-light)] border-b border-[var(--color-border)]">
      <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div id="breadcrumb" class="mb-4"></div>
        <h1 class="font-display font-semibold text-3xl text-[var(--color-text)]">Birth Certificate Application</h1>
        <p class="mt-2 text-[var(--color-text-muted)]">Fill in the details below exactly as they should appear on the certificate.</p>
      </div>
    </section>

    <section id="requirements" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <div id="application-form-wrapper">
        <div class="bg-white rounded-xl border border-[var(--color-border)] p-5 mb-8">
          <h2 class="font-medium text-[var(--color-text)] text-sm">Documents for this service <span class="font-normal text-[var(--color-text-muted)]">(suggested — confirm with the office)</span></h2>
          <ul id="requirements-list" class="mt-2 text-sm text-[var(--color-text-muted)] list-disc list-inside space-y-1"></ul>
        </div>

        <form id="birth-form" class="bg-white rounded-xl border border-[var(--color-border)] p-6 sm:p-8 space-y-8" novalidate>

        <fieldset>
          <legend class="font-display font-semibold text-[var(--color-text)] mb-4">Applicant details</legend>
          <div class="grid sm:grid-cols-2 gap-5">
            <div class="sm:col-span-2">
              <label for="applicant-name" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Applicant name <span class="text-[var(--color-accent)]">*</span></label>
              <input type="text" id="applicant-name" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="applicant-name"></p>
            </div>
            <div>
              <label for="mobile-number" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Mobile number <span class="text-[var(--color-accent)]">*</span></label>
              <input type="tel" id="mobile-number" maxlength="10" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="mobile-number"></p>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend class="font-display font-semibold text-[var(--color-text)] mb-4">Child details</legend>
          <div class="grid sm:grid-cols-2 gap-5">
            <div class="sm:col-span-2">
              <label for="child-name" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Child's name <span class="text-[var(--color-accent)]">*</span></label>
              <input type="text" id="child-name" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="child-name"></p>
            </div>
            <div>
              <label for="dob" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Date of birth <span class="text-[var(--color-accent)]">*</span></label>
              <input type="date" id="dob" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="dob"></p>
            </div>
            <div>
              <label for="gender" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Gender <span class="text-[var(--color-accent)]">*</span></label>
              <select id="gender" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] bg-white">
                <option value="">Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="gender"></p>
            </div>
            <div class="sm:col-span-2">
              <label for="place-of-birth" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Place of birth <span class="text-[var(--color-accent)]">*</span></label>
              <input type="text" id="place-of-birth" placeholder="Hospital / village / town" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="place-of-birth"></p>
            </div>
            <div>
              <label for="father-name" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Father's name <span class="text-[var(--color-accent)]">*</span></label>
              <input type="text" id="father-name" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="father-name"></p>
            </div>
            <div>
              <label for="mother-name" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Mother's name <span class="text-[var(--color-accent)]">*</span></label>
              <input type="text" id="mother-name" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="mother-name"></p>
            </div>
            <div class="sm:col-span-2">
              <label for="address" class="block text-sm font-medium text-[var(--color-text)] mb-1.5">Address <span class="text-[var(--color-accent)]">*</span></label>
              <textarea id="address" rows="3" class="w-full rounded-md border border-[var(--color-border)] px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]"></textarea>
              <p class="mt-1.5 text-xs text-red-600 hidden" data-error-for="address"></p>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend class="font-display font-semibold text-[var(--color-text)] mb-4">Supporting documents</legend>
          <div id="upload-container"></div>
        </fieldset>

        <div class="pt-2 flex flex-col sm:flex-row gap-3">
          <button type="submit" class="px-6 py-3 rounded-md bg-[var(--color-primary)] text-white text-sm font-medium hover:bg-[var(--color-primary-dark)]">Submit Application</button>
          <a href="../services.html" class="px-6 py-3 rounded-md border border-[var(--color-border)] text-sm font-medium text-[var(--color-text)] text-center hover:border-[var(--color-primary)] hover:text-[var(--color-primary)]">Cancel</a>
        </div>
        </form>
      </div>

      <div id="success-screen" class="hidden bg-white rounded-xl border border-[var(--color-border)] p-8 sm:p-10 text-center"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/document-checklists.js"></script>
  <script>window.SITE_BASE = '../';</script>
  <script src="../js/components.js"></script>
  <script src="../js/checklist-ui.js"></script>
  <script src="../js/app.js"></script>
  <script type="module" src="../js/applications.js"></script>
  <script type="module" src="../js/uploads.js"></script>
  <script src="../js/service-form.js"></script>
  <script>
    initPublicLayout('services');
    renderBreadcrumb(document.getElementById('breadcrumb'), [
      { label: 'Home', href: '../index.html' },
      { label: 'Services', href: '../services.html' },
      { label: 'Birth Certificate' },
    ]);
    const documents = initDocumentChecklist(document.getElementById('upload-container'), 'birth');

    initServiceForm({
      formId: 'birth-form',
      serviceType: 'birth',
      pagePath: 'services/birth.html',
      documents,
      getRules: () => ({
        'applicant-name': [Validators.required],
        'mobile-number': [Validators.required, Validators.mobile],
        'child-name': [Validators.required],
        'dob': [Validators.required, Validators.notFutureDate],
        'gender': [Validators.required],
        'place-of-birth': [Validators.required],
        'father-name': [Validators.required],
        'mother-name': [Validators.required],
        'address': [Validators.required],
      }),
      buildFormData: () => ({
        childName: document.getElementById('child-name').value.trim(),
        dateOfBirth: document.getElementById('dob').value,
        placeOfBirth: document.getElementById('place-of-birth').value.trim(),
        gender: document.getElementById('gender').value,
        fatherName: document.getElementById('father-name').value.trim(),
        motherName: document.getElementById('mother-name').value.trim(),
        address: document.getElementById('address').value.trim(),
        // Not part of Firebase Auth identity — the top-level applicantName
        // used for security/ownership always comes from the signed-in
        // account's own Firestore profile, never from this form. These are
        // kept as extra context on the application itself.
        applicantContactName: document.getElementById('applicant-name').value.trim(),
        applicantContactMobile: document.getElementById('mobile-number').value.trim(),
      }),
    });
  </script>
</body>
</html>
